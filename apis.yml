name: Props
description: >-
  Props (Props Project, operated by Props PBC / Open Props, founded by YouNow's Adi Sideman) was a
  blockchain-based loyalty and rewards network that let consumer apps grant users a shared crypto token
  (the Props Token) as a stake in the networks they helped grow. Backed by Union Square Ventures,
  Borderless Capital, Venrock and Comcast Ventures, it raised ~$2M and was the first Regulation A+
  consumer token qualified by the SEC, reaching over three million users across its app network. In
  August 2021 the team announced it would wind down commercial operations at year end, citing the
  regulatory constraints of running a qualified security, and open-sourced the Props Protocol contracts
  on GitHub. The propsproject.com domain no longer resolves; there is no live developer portal, API,
  documentation, or maintained SDK. This profile is retained as a historical, defunct-provider record.
